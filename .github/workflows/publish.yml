# Publish every public package to npm when a `v*` tag is pushed, over npm
# trusted publishing (OIDC, no stored token) with provenance once the repo is
# public. The trusted publisher on each package names repo `snagset/snagset`
# and workflow `publish.yml`. `workflow_dispatch` with dry-run packs and checks
# without publishing.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and check, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: npm new enough to authenticate by OIDC
        run: |
          npm install -g npm@^11.15.0
          npm -v

      - run: pnpm install --frozen-lockfile

      - name: generated files match the registry
        run: pnpm gen:names:check

      - name: create-snagset and @snagset/server carry the same version
        run: pnpm lint:lockstep

      - name: every package is at the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          for dir in packages/widget-npm packages/create-snagset apps/server packages/mcp; do
            name="$(node -p "require('./$dir/package.json').name")"
            ver="$(node -p "require('./$dir/package.json').version")"
            if [ "$ver" != "$tag" ]; then
              echo "::error::$name is $ver, but the tag says $tag"
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          echo "publishing $tag"

      - run: pnpm typecheck
      - run: pnpm test

      - name: build the widget and the dashboard the server ships
        run: |
          pnpm build:widget
          pnpm --filter @snagset/dashboard build

      - name: publish
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -e
          if [ "$VISIBILITY" = "public" ]; then
            PROV="--provenance"
            echo "· repository is public — publishing WITH provenance"
          else
            PROV=""
            echo "::warning title=Unattested release::Repository visibility is '$VISIBILITY'. npm rejects provenance from a non-public source repo (422), so this release carries NO attestation. It turns itself back on when the repo is public."
          fi
          for dir in packages/widget-npm packages/create-snagset apps/server packages/mcp; do
            name="$(node -p "require('./$dir/package.json').name")"
            private="$(node -p "!!require('./$dir/package.json').private")"
            if [ "$private" = "true" ]; then echo "· $name is private, skipping"; continue; fi
            ver="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "· $name@$ver is already published, skipping"
              continue
            fi
            echo "── $name@$ver"
            npm publish $PROV --access public "./$dir"
          done

      - name: pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set -e
          for dir in packages/widget-npm packages/create-snagset apps/server packages/mcp; do
            private="$(node -p "!!require('./$dir/package.json').private")"
            [ "$private" = "true" ] && continue
            npm publish --dry-run --access public "./$dir"
          done
